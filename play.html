  $('pA').classList.toggle('on',s.turn==='a'&&!s.winner);$('pB').classList.toggle('on',s.turn==='b'&&!s.winner);
  cur=s;
  if(s.winner){if(!winT&&!cfOn){winT=setTimeout(()=>{winT=0;if(!cur||!cur.winner)return;cfOn=1;$('wt').textContent=cur.end||(cur.winner==='draw'?"It's a draw 🤝":`${names[cur.winner]} wins! 🎉`);$('win').classList.remove('hidden');if(cur.winner!=='draw'||cur.end)confetti();},1300);}}
  else{clearTimeout(winT);winT=0;cfOn=0;$('win').classList.add('hidden');$('cf').textContent='';}
}
async function leave(){leaving=true;await Promise.race([setDoc(ref,{left:role},{merge:true}).catch(()=>{}),new Promise(r=>setTimeout(r,1500))]);location.href='games.html';}
let rc=0;$('restart').onclick=()=>{const b=$('restart');if(!rc){b.textContent=`Tap again — ${partner} loses progress too`;rc=setTimeout(()=>{rc=0;b.textContent='Restart';},3500);}else{clearTimeout(rc);rc=0;b.textContent='Restart';A.root.dataset.g='';act(()=>G.init('a'));}};
$('again').onclick=()=>{A.root.dataset.g='';act(s=>s&&s.winner?G.init(s.winner==='draw'?'a':other(s.winner)):null);};
$('leave').onclick=$('leave2').onclick=leave;
initChat({db,roomId,me,partner});
onSnapshot(doc(db,'users',me.toLowerCase()),snap=>{if(!leaving&&snap.exists()&&snap.data().roomId!==roomId){leaving=true;toast('You are no longer paired.');setTimeout(()=>location.href='index.html',1600);}});
(async()=>{
  await act(s=>s?(s.left===role?{...s,left:null}:null):G.init('a'));
  setDoc(roomRef,{gamePing:{by:me,g:gid,ts:Date.now()}},{merge:true}).catch(()=>{});
  let prev=-1;onSnapshot(ref,snap=>{const s=snap.data();if(s&&s.n!==prev){const fresh=!s.n||s.n<prev;prev=s.n||0;if(fresh)A.root.dataset.g='';}render(s);},()=>{$('st').textContent='Cannot connect — check internet and Firestore rules';});
})();
